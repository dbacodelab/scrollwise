<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ScrollWise English</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:opsz,wght@9..40,300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--border:rgba(255,255,255,0.08);
  --text:#f0f0f8;--muted:#6b6b80;--accent:#7c6af7;--accent2:#3ecfb2;
  --accent3:#f5a623;--accent4:#f06292;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}
#app{height:100vh;display:flex;flex-direction:column;max-width:430px;margin:0 auto}
/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;border-bottom:1px solid var(--border);flex-shrink:0;gap:12px}
.logo{font-family:var(--mono);font-size:14px;font-weight:700;white-space:nowrap}.logo span{color:var(--accent)}
.xp-wrap{flex:1}
.xp-lbl{font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:3px;display:flex;justify-content:space-between}
.xp-track{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .5s}
.streak{font-family:var(--mono);font-size:12px;color:var(--accent3);white-space:nowrap}
/* TABS */
.tabs{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-pill{font-family:var(--mono);font-size:10px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s}
.tab-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* FEED */
.feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
/* CARD */
.card{scroll-snap-align:start;height:calc(100vh - 148px);display:flex;flex-direction:column;padding:18px 16px 14px;position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-bottom:16px;width:fit-content}
.b-vocab{background:rgba(124,106,247,.15);color:var(--accent);border:1px solid rgba(124,106,247,.3)}
.b-lesson{background:rgba(62,207,178,.15);color:var(--accent2);border:1px solid rgba(62,207,178,.3)}
.b-writing{background:rgba(245,166,35,.15);color:var(--accent3);border:1px solid rgba(245,166,35,.3)}
.b-interview{background:rgba(240,98,146,.15);color:var(--accent4);border:1px solid rgba(240,98,146,.3)}
/* FLASHCARD */
.fc-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.fc-unit{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:1px}
.fc-word{font-family:var(--mono);font-size:clamp(22px,6vw,32px);font-weight:700;color:var(--text);letter-spacing:-1px;margin-bottom:6px}
.fc-pos{font-size:12px;color:var(--accent);font-family:var(--mono);margin-bottom:4px}
.fc-pron{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:24px}
.reveal-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-family:var(--sans);font-size:14px;padding:11px 26px;border-radius:12px;cursor:pointer;transition:all .2s}
.reveal-btn:active{border-color:var(--accent);color:var(--text)}
.fc-answer{display:none;flex-direction:column;align-items:center;gap:10px;animation:fadeIn .3s ease}
.fc-answer.show{display:flex}
.fc-def{font-size:16px;font-weight:500;color:var(--text);line-height:1.55;max-width:320px;text-align:center}
.fc-ex{font-size:13px;color:var(--muted);font-style:italic;max-width:300px;text-align:center;line-height:1.6;background:var(--bg3);padding:10px 14px;border-radius:10px;border-left:2px solid var(--accent)}
.rating-row{display:flex;gap:10px;margin-top:6px}
.btn-easy{background:rgba(62,207,178,.15);color:var(--accent2);border:1px solid rgba(62,207,178,.3);padding:9px 22px;border-radius:10px;font-size:13px;cursor:pointer;font-family:var(--sans);font-weight:600}
.btn-hard{background:rgba(240,98,146,.15);color:var(--accent4);border:1px solid rgba(240,98,146,.3);padding:9px 22px;border-radius:10px;font-size:13px;cursor:pointer;font-family:var(--sans);font-weight:600}
/* PROGRESS INDICATOR */
.card-progress{position:absolute;top:14px;right:16px;font-family:var(--mono);font-size:10px;color:var(--muted)}
/* UNIT HEADER */
.unit-header{background:var(--bg3);border-radius:12px;padding:14px 16px;margin-bottom:14px;border:1px solid var(--border)}
.unit-title{font-family:var(--mono);font-size:12px;color:var(--accent2);margin-bottom:4px;letter-spacing:.5px}
.unit-count{font-size:13px;color:var(--muted)}
/* BOTTOMBAR */
.bottombar{display:flex;border-top:1px solid var(--border);flex-shrink:0;padding:4px 0 8px}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10px;font-family:var(--mono);color:var(--muted);cursor:pointer;border:none;background:none;transition:color .2s}
.nav-tab.active{color:var(--accent)}
.nav-icon{font-size:17px}
/* STATS VIEW */
.stats-view{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:14px}
.stats-view.show{display:flex}
.stat-card{background:var(--bg3);border-radius:14px;padding:16px;border:1px solid var(--border)}
.stat-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.stat-val{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--text)}
.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}
.progress-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unit-prog{background:var(--bg3);border-radius:10px;padding:12px;border:1px solid var(--border)}
.u-name{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:6px}
.u-bar{height:3px;background:var(--bg);border-radius:2px;overflow:hidden}
.u-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .8s}
.u-pct{font-size:11px;color:var(--text);margin-top:4px;font-family:var(--mono)}
/* SWIPE HINT */
.swipe-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;animation:bob 2s ease-in-out infinite;pointer-events:none}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.bg-orb{position:absolute;border-radius:50%;pointer-events:none;opacity:.05}
/* EMPTY */
.empty-state{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;padding:24px}
.empty-icon{font-size:40px}
.empty-title{font-family:var(--mono);font-size:16px;color:var(--text)}
.empty-sub{font-size:14px;color:var(--muted);line-height:1.6;max-width:260px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">Scroll<span>Wise</span></div>
    <div class="xp-wrap">
      <div class="xp-lbl"><span>XP LEVEL <span id="lvl">1</span></span><span id="xp-text">0 / 500</span></div>
      <div class="xp-track"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
    </div>
    <div class="streak">🔥 <span id="streak">0</span></div>
  </div>
  <div class="tabs" id="unit-tabs"></div>
  <div class="feed" id="feed"></div>
  <div class="stats-view" id="stats-view">
    <div class="stat-card">
      <div class="stat-label">Cards Reviewed</div>
      <div class="stat-val" id="s-reviewed">0</div>
      <div class="stat-sub">Total sessions</div>
    </div>
    <div class="progress-grid" id="unit-progress-grid"></div>
  </div>
  <div class="bottombar">
    <button class="nav-tab active" id="nav-feed" onclick="showFeed()"><span class="nav-icon">⚡</span>Feed</button>
    <button class="nav-tab" id="nav-stats" onclick="showStats()"><span class="nav-icon">📊</span>Stats</button>
    <button class="nav-tab" onclick="practiceWithAI()"><span class="nav-icon">🤖</span>Practice</button>
  </div>
</div>

\u0259ni","def":"an organisation that makes or sells something or provides a service","example":"The company makes washing machines."},{"unit":1,"word":"country","pos":"n [C]","pron":"\u02c8k\u028cntri","def":"an area of land that is controlled by its own government, president, king, etc.","example":"Russia is the largest country in the world."},{"unit":1,"word":"course","pos":"n [C]","pron":"k\u0254\u02d0s","def":"a series of lessons or a period of study in a particular subject","example":"Andy\u2019s doing a computer course."},{"unit":1,"word":"currency","pos":"n [C]","pron":"\u02c8k\u028cr\u0259nsi","def":"the type of money that a country uses","example":"foreign currency"},{"unit":1,"word":"date of birth","pos":"n [C, U]","pron":"de\u026at \u0259v b\u025c\u02d0\u03b8","def":"the day when someone was born","example":"What's your date of birth?"},{"unit":1,"word":"deadline","pos":"n [C]","pron":"\u02c8dedla\u026an","def":"a date or time by which you must finish something","example":"He failed to meet the deadline."},{"unit":1,"word":"degree","pos":"n [C]","pron":"d\u026a\u02c8gri\u02d0","def":"a unit for measuring temperature","example":"a 90 degree angle (=90\u00b0)"},{"unit":1,"word":"doctor","pos":"n [C]","pron":"\u02c8d\u0252kt\u0259","def":"someone who is trained to treat people who are ill","example":"You should go to the doctor with that cough."},{"unit":1,"word":"electrical","pos":"adj","pron":"\u026a\u02c8lektr\u026ak\u0259l","def":"using or relating to electricity","example":"an electrical fault"},{"unit":1,"word":"email address","pos":"n [C]","pron":"\u02c8i\u02d0 me\u026al \u0259\u02c8dres","def":"everyone who sends emails has their own address for emailing","example":"I've lost all my email addresses."},{"unit":1,"word":"employee","pos":"n [C]","pron":"\u026am\u02c8pl\u0254\u026a-i\u02d0, \u02ccempl\u0254\u026a\u02c8i\u02d0","def":"someone who receives a salary (=payment) to work for an organisation, person, or company","example":"government employees"},{"unit":1,"word":"engineer","pos":"n [C]","pron":"\u02ccend\u0292\u0259\u02c8n\u026a\u0259","def":"someone whose job is to design, build, or repair roads, bridges, machines, etc.","example":"Brunel was a great engineer."},{"unit":1,"word":"experience","pos":"n [U]","pron":"\u026ak\u02c8sp\u026a\u0259ri\u0259ns","def":"knowledge or skill that you learn when you do something yourself, or when something happens to you","example":"He\u2019s a very good teacher with a lot of experience."},{"unit":1,"word":"fine","pos":"adj","pron":"fa\u026an","def":"satisfactory or acceptable","example":"\u2018We\u2019re meeting at 8.30.\u2019 \u2018Okay, fine.\u2019"},{"unit":1,"word":"first name","pos":"n [C]","pron":"f\u025c\u02d0st ne\u026am","def":"a name that comes before your family name","example":"My teacher\u2019s first name is Caroline."},{"unit":1,"word":"footballer","pos":"n [C]","pron":"\u02c8f\u028atb\u0254\u02d0l\u0259","def":"a game played by two teams of 11 players who try to kick a ball into the other team\u2019s goal","example":"a professional footballer"},{"unit":1,"word":"Friday","pos":"n [C, U]","pron":"\u02c8fra\u026adi, -de\u026a","def":"the day between Thursday and Saturday","example":"I do the shopping on Fridays."},{"unit":1,"word":"friend","pos":"n [C]","pron":"frend","def":"someone who you know well and enjoy spending time with","example":"This is my friend Kate."},{"unit":1,"word":"from","pos":"prep","pron":"fr\u0259m","def":"starting at a particular place, time, or level","example":"He drove all the way from Colorado."},{"unit":1,"word":"full name","pos":"n [C]","pron":"f\u028al ne\u026am","def":"someone's complete name (every name they have)","example":"Write your full name on the page, please."},{"unit":1,"word":"German","pos":"adj","pron":"\u02c8d\u0292\u025c\u02d0m\u0259n","def":"the people or language of Germany","example":"I have a German pen friend."},{"unit":1,"word":"good","pos":"adj","pron":"g\u028ad","def":"of a high standard or quality","example":"a good hotel"},{"unit":1,"word":"hard-working","pos":"adj","pron":"\u02cch\u0251\u02d0d\u00a0\u02c8w\u025c\u02d0k\u00a0\u026a\u014b","def":"working with a lot of effort","example":"a hard-working student"},{"unit":1,"word":"holiday","pos":"n [C]","pron":"\u02c8h\u0252l\u0259di, -de\u026a","def":"a period when you travel to another place for pleasure","example":"Did you have a nice holiday?"},{"unit":1,"word":"home number","pos":"n [C]","pron":"h\u0259\u028am \u02c8n\u028cmb\u0259","def":"the phone number for where you live","example":"This is my home number, not my mobile one."},{"unit":1,"word":"industry","pos":"n [C]","pron":"\u02c8\u026and\u0259stri","def":"the production of goods","example":"Most of these men work in the construction industry."},{"unit":1,"word":"Irish","pos":"adj","pron":"\u02c8a\u026a\u0259r\u026a\u0283","def":"someone or something from Ireland","example":"an Irish family"},{"unit":1,"word":"Italian","pos":"adj","pron":"\u026a\u02c8t\u00e6li\u0259n","def":"someone or something from Italy","example":"Italian art"},{"unit":1,"word":"Japanese","pos":"adj","pron":"\u02ccd\u0292\u00e6p\u0259\u02c8ni\u02d0z","def":"someone or something from Japan","example":"a Japanese mother"},{"unit":1,"word":"job","pos":"n [C]","pron":"d\u0292\u0252b","def":"the work that you do regularly to earn money","example":"She applied for a job at a bank."},{"unit":1,"word":"know","pos":"v [I, T]","pron":"n\u0259\u028a","def":"to have knowledge or information about something","example":"Who knows the answer?"},{"unit":1,"word":"knowledge","pos":"n [U]","pron":"\u02c8n\u0252l\u026ad\u0292","def":"the information, skills, and understanding that you have got through learning or experience","example":"You don\u2019t need to have any special knowledge to do this job."},{"unit":1,"word":"Korean","pos":"adj","pron":"k\u0259\u00a0\u02c8r\u026a\u0259n","def":"someone or something from Korea","example":"a Korean grandfather"},{"unit":1,"word":"language","pos":"n [C, U]","pro // State
let state = {
  xp: parseInt(localStorage.getItem('sw_xp')||'0'),
  streak: parseInt(localStorage.getItem('sw_streak')||'0'),
  reviewed: JSON.parse(localStorage.getItem('sw_reviewed')||'{}'),
  hard: JSON.parse(localStorage.getItem('sw_hard')||'[]'),
  currentUnit: parseInt(localStorage.getItem('sw_unit')||'1'),
  cardIndex: 0,
  lastWord: localStorage.getItem('sw_lastword')||'',
  totalReviewed: parseInt(localStorage.getItem('sw_total')||'0')
};

const UNITS = [...new Set(ALL_CARDS.map(c=>c.unit))].sort((a,b)=>a-b);
const XP_PER_LEVEL = 500;

function saveState(){
  localStorage.setItem('sw_xp', state.xp);
  localStorage.setItem('sw_streak', state.streak);
  localStorage.setItem('sw_reviewed', JSON.stringify(state.reviewed));
  localStorage.setItem('sw_hard', JSON.stringify(state.hard));
  localStorage.setItem('sw_total', state.totalReviewed);
  localStorage.setItem('sw_unit', state.currentUnit);
  localStorage.setItem('sw_lastword', state.lastWord||'');
}

function addXP(n){
  state.xp += n;
  saveState();
  updateTopbar();
}

function updateTopbar(){
  const level = Math.floor(state.xp / XP_PER_LEVEL) + 1;
  const xpInLevel = state.xp % XP_PER_LEVEL;
  const pct = (xpInLevel / XP_PER_LEVEL) * 100;
  document.getElementById('lvl').textContent = level;
  document.getElementById('xp-text').textContent = xpInLevel + ' / ' + XP_PER_LEVEL;
  document.getElementById('xp-fill').style.width = pct + '%';
  document.getElementById('streak').textContent = state.streak;
}

function buildTabs(){
  const tabs = document.getElementById('unit-tabs');
  tabs.innerHTML = UNITS.map(u => {
    const total = ALL_CARDS.filter(c=>c.unit===u).length;
    const done = state.reviewed[u] ? state.reviewed[u].length : 0;
    const pct = Math.round(done/total*100);
    return `<button class="tab-pill ${u===state.currentUnit?'active':''}" onclick="selectUnit(${u})" id="tab-${u}">
      U${u} <span style="opacity:.6">${pct}%</span>
    </button>`;
  }).join('');
}

function selectUnit(u){
  state.currentUnit = u;
  state.cardIndex = 0;
  document.querySelectorAll('.tab-pill').forEach(t=>t.classList.remove('active'));
  const tab = document.getElementById('tab-'+u);
  if(tab){tab.classList.add('active');tab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
  renderFeed();
}

function getUnitCards(u){
  const all = ALL_CARDS.filter(c=>c.unit===u);
  // Shuffle unreviewed first, then hard ones, then rest
  const reviewed = state.reviewed[u] || [];
  const unreviewed = all.filter(c=>!reviewed.includes(c.word));
  const hard = all.filter(c=>state.hard.includes(c.word) && reviewed.includes(c.word));
  const rest = all.filter(c=>reviewed.includes(c.word) && !state.hard.includes(c.word));
  return [...unreviewed, ...hard, ...rest];
}

function renderFeed(){
  const feed = document.getElementById('feed');
  const cards = getUnitCards(state.currentUnit);
  if(!cards.length){
    feed.innerHTML = `<div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-title">Unit complete!</div><div class="empty-sub">You've reviewed all words in this unit. Select another unit above.</div></div>`;
    return;
  }
  
  const totalInUnit = ALL_CARDS.filter(c=>c.unit===state.currentUnit).length;
  const doneInUnit = (state.reviewed[state.currentUnit]||[]).length;

  feed.innerHTML = cards.map((card, i) => {
    const isHard = state.hard.includes(card.word);
    return `<div class="card" id="card-${i}">
      <div class="bg-orb" style="width:220px;height:220px;background:var(--accent);top:-60px;right:-60px"></div>
      <div class="badge b-vocab">⚡ Unit ${card.unit} · Vocabulary</div>
      <div class="card-progress">${doneInUnit}/${totalInUnit}</div>
      <div class="fc-body">
        <div class="fc-unit">UNIT ${card.unit} · ${card.pos}</div>
        <div class="fc-word">${escHtml(card.word)}</div>
        ${card.pron ? `<div class="fc-pron">/${escHtml(card.pron)}/</div>` : ''}
        <button class="reveal-btn" onclick="reveal(${i})">Tap to reveal →</button>
        <div class="fc-answer" id="ans-${i}">
          <div class="fc-def">${escHtml(card.def)}</div>
          ${card.example ? `<div class="fc-ex">"${escHtml(card.example)}"</div>` : ''}
          <div class="rating-row">
            <button class="btn-hard" onclick="rate(${i},'hard','${escAtt(card.word)}')">Hard 😓</button>
            <button class="btn-easy" onclick="rate(${i},'easy','${escAtt(card.word)}')">Got it ✓</button>
          </div>
        </div>
      </div>
      ${i === 0 ? '<div class="swipe-hint">↓ scroll</div>' : ''}
    </div>`;
  }).join('');
  
  feed.scrollTop = 0;
  // Restore position to last reviewed word
  if(state.lastWord){
    setTimeout(()=>{
      const wordEls = feed.querySelectorAll('.fc-word');
      for(let el of wordEls){
        if(el.textContent === state.lastWord){
          const card = el.closest('.card');
          if(card) card.scrollIntoView({behavior:'auto'});
          break;
        }
      }
    }, 80);
  }
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAtt(s){
  return String(s).replace(/'/g,"\'").replace(/"/g,'&quot;');
}

function reveal(i){
  const ans = document.getElementById('ans-'+i);
  const btn = document.querySelector('#card-'+i+' .reveal-btn');
  if(ans)ans.classList.add('show');
  if(btn)btn.style.display='none';
}

function rate(i, rating, word){
  // Mark reviewed
  if(!state.reviewed[state.currentUnit]) state.reviewed[state.currentUnit]=[];
  if(!state.reviewed[state.currentUnit].includes(word)) state.reviewed[state.currentUnit].push(word);
  
  // Hard list
  if(rating==='hard'){
    if(!state.hard.includes(word)) state.hard.push(word);
  } else {
    state.hard = state.hard.filter(w=>w!==word);
  }

  state.totalReviewed++;
  state.lastWord = word;
  addXP(rating==='easy'?20:10);
  if(state.totalReviewed % 10 === 0) state.streak++;
  saveState();
  buildTabs();

  // Scroll to next card
  const feed = document.getElementById('feed');
  const cards = feed.querySelectorAll('.card');
  const next = cards[i+1];
  if(next){
    next.scrollIntoView({behavior:'smooth'});
    // Save the word of the next card as resume point
    const nextWord = next.querySelector('.fc-word');
    if(nextWord) { state.lastWord = nextWord.textContent; saveState(); }
  } else {
    setTimeout(()=>renderFeed(), 400);
  }
}

function showFeed(){
  document.getElementById('feed').style.display='';
  document.getElementById('stats-view').classList.remove('show');
  document.getElementById('nav-feed').classList.add('active');
  document.getElementById('nav-stats').classList.remove('active');
}

function showStats(){
  document.getElementById('feed').style.display='none';
  const sv = document.getElementById('stats-view');
  sv.classList.add('show');
  document.getElementById('nav-feed').classList.remove('active');
  document.getElementById('nav-stats').classList.add('active');
  document.getElementById('s-reviewed').textContent = state.totalReviewed;
  
  // Unit progress grid
  const grid = document.getElementById('unit-progress-grid');
  grid.innerHTML = UNITS.map(u=>{
    const total = ALL_CARDS.filter(c=>c.unit===u).length;
    const done = (state.reviewed[u]||[]).length;
    const pct = Math.round(done/total*100);
    return `<div class="unit-prog">
      <div class="u-name">UNIT ${u}</div>
      <div class="u-bar"><div class="u-fill" style="width:${pct}%"></div></div>
      <div class="u-pct">${done}/${total} · ${pct}%</div>
    </div>`;
  }).join('');
}

function practiceWithAI(){
  const cards = getUnitCards(state.currentUnit);
  const hardWords = ALL_CARDS.filter(c=>state.hard.includes(c.word)).slice(0,5).map(c=>c.word);
  if(hardWords.length > 0){
    if(typeof sendPrompt !== 'undefined'){
      sendPrompt('Practica conmigo las palabras que me han costado más: ' + hardWords.join(', ') + '. Hazme una pregunta de uso en contexto para cada una, una por una.');
    }
  } else {
    const sample = cards.slice(0,3).map(c=>c.word);
    if(typeof sendPrompt !== 'undefined'){
      sendPrompt('Quiero practicar las palabras de la Unidad ' + state.currentUnit + '. Empieza con: ' + sample.join(', ') + '. Úsalas en una situación de entrevista de trabajo en inglés.');
    }
  }
}

// Init
updateTopbar();
buildTabs();
renderFeed();
</script>

    navigator.serviceWorker.register('sw.js')

      .catch(e => console.log('SW error', e));
  });
}
